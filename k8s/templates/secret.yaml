{{/*
Chart-managed Mergician credentials secret.

This resource is only created when secrets.existingSecret is NOT set.
In production, manage secrets externally (Sealed Secrets, External Secrets
Operator, Vault, etc.) and set secrets.existingSecret to the name of that
pre-created Secret instead.

Required keys in the secret:
  gitlab-service-token       — GitLab API service token (api scope)
  gitlab-oauth-client-id     — GitLab OAuth application Client ID
  gitlab-oauth-client-secret — GitLab OAuth application Client Secret
  database-password          — Only when postgresql.enabled=false
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mergician.fullname" . }}-secrets
  labels:
    {{- include "mergician.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  gitlab-service-token: {{ required "secrets.gitlabServiceToken is required (or set secrets.existingSecret to reference a pre-created Secret)" .Values.secrets.gitlabServiceToken | quote }}
  gitlab-oauth-client-id: {{ required "secrets.gitlabOauthClientId is required (or set secrets.existingSecret to reference a pre-created Secret)" .Values.secrets.gitlabOauthClientId | quote }}
  gitlab-oauth-client-secret: {{ required "secrets.gitlabOauthClientSecret is required (or set secrets.existingSecret to reference a pre-created Secret)" .Values.secrets.gitlabOauthClientSecret | quote }}
  {{- if not .Values.postgresql.enabled }}
  database-password: {{ required "secrets.databasePassword is required when postgresql.enabled=false (or set secrets.existingSecret)" .Values.secrets.databasePassword | quote }}
  {{- end }}
{{- end }}
